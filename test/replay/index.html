<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout Replay</title>
  <!-- Rebuilds carrier pages from a layout file (captures/<carrier>/*.json, one built by
       scripts/build-layouts.mjs, or a bake-off course in test/bakeoff/) as working ExtJS pages
       with Duck Creek-style ids, captions and a server round-trip after each answer.
       Serve the repo root (npm run replay) and open /test/replay/.

       Modes
         default       fill pages with the extension's engine; coverage report; save results
         ?bakeoff=1    for a browser agent (or a person): only the quote pages, their buttons,
                       "Next page ›" and a "Continue ›" that must never be clicked; timed;
                       "Finish & save results" at the end

       Built from recorded structure only; no carrier HTML or code is copied. -->
  <!-- Pinned by digest (sha384 of the file as served on 2026-10-09): a changed CDN file fails to load
       rather than run. The theme file only @imports theme-classic-all_1.css and _2.css, which SRI can't cover. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/extjs/6.2.0/classic/theme-classic/resources/theme-classic-all.css" integrity="sha384-j3cnHQ5LsK0fZv5mIMOcJqy4Y1LqTc5SpHdvJlmB/xWi/TLiCGfs42R8tmzImG0O" crossorigin="anonymous">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/extjs/6.2.0/ext-all.js" integrity="sha384-bsqJqrw6VhSpaUjQxevNcAHID8V/fuk3k0gpmvE4P67kx2nh3DRhTOZ9PMb2q7yq" crossorigin="anonymous"></script>
  <script src="show-when.js"></script>
  <script src="units.js"></script>
  <style>
    body { font: 13px system-ui, sans-serif; margin: 0; background: #fff; color: #111; }
    header { position: sticky; top: 0; z-index: 10; background: #f3f4f6; border-bottom: 1px solid #ddd; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    header input[type=text] { width: 420px; max-width: 100%; font: inherit; padding: 4px 6px; }
    header select, header button { font: inherit; padding: 4px 8px; }
    main { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 1fr); gap: 16px; padding: 16px; }
    @media (max-width: 1200px) { main { grid-template-columns: 1fr; } }
    #report { overflow-x: auto; }
    #report ul { margin: 0; padding-left: 16px; }
    h2.page-title { font-size: 16px; margin: 0 0 8px; }
    .caption { margin: 12px 0 3px; font-weight: 600; }
    .tag { font-weight: 400; font-size: 11px; color: #92400e; background: #fef3c7; border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
    .buttons { margin-top: 18px; display: grid; gap: 8px; }
    #report table { border-collapse: collapse; width: 100%; font-size: 12px; }
    #report th, #report td { border-bottom: 1px solid #e5e7eb; padding: 4px 6px; text-align: left; vertical-align: top; }
    #report .num { text-align: right; }
    .muted { color: #6b7280; }
    .err { color: #b91c1c; }
    body.bakeoff .dev { display: none !important; }
    body:not(.bakeoff) .bakeoff-only { display: none !important; }
  </style>
</head>
<body>
  <header>
    <label class="dev">Layout <input id="layout" type="text" value="/test/bakeoff/course-MD-expediter-van.json"></label>
    <button id="load" class="dev">Load</button>
    <label>Page <select id="page"></select></label>
    <label class="dev">Intake <input id="pdf" type="file" accept="application/pdf"></label>
    <button id="fill-one" class="dev">Fill this page</button>
    <button id="fill-all" class="dev">Fill every page</button>
    <button id="start" class="bakeoff-only">Start</button>
    <button id="save">Finish &amp; save results</button>
    <span id="status" class="muted"></span>
  </header>
  <main>
    <section><h2 id="page-title" class="page-title"></h2><div id="form"></div><div id="buttons" class="buttons"></div></section>
    <section id="report" class="dev"><p class="muted">Load a layout, then fill a page or every page. The intake defaults to the fake sample (test/fixtures/sample-intake.pdf).</p></section>
  </main>

  <script>
    // --- Duck Creek-style components (same idea as test/mock-progressive) ----------------------
    const GUID = 'A8BF9205B84D84AF79F30CD043C8464E';
    Ext.define('Replay.Combo', { extend: 'Ext.form.field.ComboBox', alias: 'widget.dctcombofield' });
    Ext.define('Replay.RadioGroup', { extend: 'Ext.form.RadioGroup', alias: 'widget.dctradiogroup' });
    Ext.define('Replay.Radio', { extend: 'Ext.form.field.Radio', alias: 'widget.dctradiofield' });
    Ext.define('Replay.Text', { extend: 'Ext.form.field.Text', alias: 'widget.dctinputstringfield' });
    Ext.define('Replay.Check', { extend: 'Ext.form.field.Checkbox', alias: 'widget.dctcheckboxfield' });

    // Per page: answers[key] = the component value (combo code / radio text / checkbox bool / text),
    // texts[key] = what it shows (key: the question id, with its row past the first). clicks: every
    // button pressed, in order.
    window.replay = { byPage: {}, form: null, fields: [], page: null, clicks: [], started: null };
    const store = (page) => (window.replay.byPage[page] ??= { answers: {}, texts: {} });

    // ?shift=55 renumbers every question by that much, as Progressive did on 2026-10-07 (Agent Code
    // 18F became 1C6): the fill must find the same questions by their names and texts.
    const SHIFT = Number(new URLSearchParams(location.search).get('shift')) || 0;
    function idFor(f, i) {
      // Layout fields without a question id get a stable made-up one, so they still render.
      const recorded = f.q && /^[0-9A-F]+$/.test(f.q) ? f.q : `F${(1000 + i).toString(16).toUpperCase()}`;
      const q = SHIFT ? (parseInt(recorded, 16) + SHIFT).toString(16).toUpperCase() : recorded;
      // Its Duck Creek row (<page>_<row>; on Rates, one per vehicle and trailer) when the layout
      // recorded one, else the first: the fill tells a unit's rows apart by it. A field named after
      // a unit but recorded before rows, on a page whose units have rows, is drawn apart from them
      // (9_1): which unit's it was isn't known, and in the first row it would rename that unit.
      const apart = !/^\d+_\d+$/.test(f.row ?? '') && !!window.replay.units?.apart.has(f);
      const row = /^\d+_\d+$/.test(f.row ?? '') ? f.row : apart ? '9_1' : '8_1';
      return { id: `f_a${GUID}${q}_${row}`, q, key: replayAnswerKey(q, row, apart) };
    }
    // Duck Creek's data-model name on the field's input (fieldref="RiskInput.VIN"), when recorded.
    const refAttr = (f) => (f.ref ? { inputAttrTpl: `fieldref="${Ext.String.htmlEncode(f.ref)}"` } : {});
    const optionsOf = (f) => (f.opts ?? []).filter((o) => o && !/^…/.test(o));
    // A unit's row shows the name the replay gave that unit (units.js).
    const captionOf = (f) => replayUnitCaption(f, window.replay.units, window.replay.page);

    function fieldConfig(f, i) {
      // Redacted captures are layouts, not lookup responses. The default replay scenario is
      // a successful lookup for the supplied synthetic record; failure tests inject independent
      // response options instead. Never ask the engine to accept "[client]" as a real identity.
      const record = window.replay.record;
      if (record && f.q === '22F') f = { ...f, opts: (f.opts ?? []).map(o => o.includes('[client]') ? record.applicant.name || record.applicant.owner1 : o) };
      const { id, q, key } = idFor(f, i);
      const { answers, texts } = store(window.replay.page);
      const common = { id, dctCaption: captionOf(f) || '(no caption)', dctRequired: !!f.req, ...refAttr(f) };
      const answer = (v, text) => { answers[key] = v; texts[key] = text ?? v; window.replay.roundTrip(); };
      const opts = optionsOf(f);
      if (f.kind === 'radio' || f.kind === 'checkgroup') {
        const list = opts.length ? opts : ['Yes', 'No'];
        return { ...common, xtype: 'dctradiogroup', columns: 1, vertical: true,
          items: list.map((o, j) => ({ xtype: 'dctradiofield', id: `${id}_${j}`, name: `string_${key}`, boxLabel: o, inputValue: o, checked: answers[key] === o, ...refAttr(f) })),
          listeners: { change: (g, v) => answer(v[`string_${key}`]) } };
      }
      if (f.kind === 'checkbox') {
        return { ...common, xtype: 'dctcheckboxfield', name: `boolean_${key}`, boxLabel: captionOf(f), value: answers[key] === true,
          listeners: { change: (c, v) => answer(v, v ? 'checked' : 'unchecked') } };
      }
      if (f.kind === 'combo' && opts.length) {
        return { ...common, xtype: 'dctcombofield', queryMode: 'local', editable: true, forceSelection: true, anyMatch: true,
          store: { fields: ['code', 'text'], data: opts.map((t, j) => ({ code: `${q}-${j}`, text: t })) },
          displayField: 'text', valueField: 'code', value: answers[key] ?? null,
          listeners: { blur: (c) => { if ((answers[key] ?? null) !== c.getValue()) answer(c.getValue(), c.getRawValue()); } } };
      }
      return { ...common, xtype: 'dctinputstringfield', name: `string_${key}|`, maxLength: f.max, enforceMaxLength: !!f.max, value: answers[key] ?? f.decoded ?? '',
        listeners: { blur: (c) => { if ((answers[key] ?? '') !== c.getValue()) answer(c.getValue()); } } };
    }

    // Answers the carrier pre-selects (layout field `default`), set the first time a page opens.
    window.replay.applyDefaults = function applyDefaults(page, fields) {
      const s = store(page);
      if (s.defaulted) return;
      s.defaulted = true;
      fields.forEach((f, i) => {
        if (f.default === undefined) return;
        const { q, key } = idFor(f, i);
        const j = optionsOf(f).indexOf(f.default);
        s.answers[key] = f.kind === 'combo' ? `${q}-${j}` : f.default;
        s.texts[key] = f.default;
      });
    };

    window.replay.click = function click(text, row) {
      window.replay.clicks.push({ page: window.replay.page, text, row: row ?? null, at: new Date().toISOString() });
      document.getElementById('status').textContent = `Clicked "${text}"${row ? ` (${row})` : ''}`;
      if (row && window.replay.fields.some((f) => f.showAfter === row)) window.replay.roundTrip();
      if (!row && lookupOf(text)) window.replay.lookup(lookupOf(text));
    };

    // The page's lookup buttons show their result after a round trip, as the carrier's do (a
    // click that shows nothing isn't done, to the fill): Lookup VIN decodes the intake vehicle's
    // year, make and model into fields the fill checks against the intake; Verify DOT draws the
    // registered record's questions (its name and address to pick, whether the number belongs to
    // the business), which a layout with the button shows only once it ran. Built from the
    // recorded fields and the intake; no carrier response is copied.
    const LOOKUPS = { vin: /^look ?up( vin)?$/i, dot: /^verify( us)?( ?dot)?( number)?$/i };
    const lookupOf = (text) => Object.keys(LOOKUPS).find((k) => LOOKUPS[k].test(String(text ?? '').trim())) ?? null;
    const dotResult = (f) => /usdot number belong/i.test(f.caption ?? '') || ((f.opts ?? []).some((o) => /^enter a different/i.test(o)) && !/home address/i.test(f.caption ?? ''));
    window.replay.lookup = function lookup(kind) {
      const r = window.replay;
      const s = store(r.page);
      (s.lookups ??= new Set()).add(kind);
      if (kind === 'vin' && !r.fields.some((f) => f.decodedBy)) {
        // The vehicle whose VIN is on the page (the replay repeats Add Vehicle once per vehicle);
        // a page with no VIN entered decodes the first. A VIN no intake vehicle has decodes nothing.
        const id = (x) => String(x ?? '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        const at = r.fields.findIndex((f) => !f.decodedBy && (/(^|\.)vin$/i.test(f.ref ?? '') || /^vin\b/i.test(f.caption ?? '')));
        const typed = at < 0 ? '' : id(s.texts[idFor(r.fields[at], at).key]);
        const vehicles = r.record?.vehicles ?? [];
        const v = (typed ? vehicles.find((x) => id(x.vin) === typed) : vehicles[0]) ?? {};
        r.fields = [...r.fields, ...[['Year', v.year], ['Make', v.make], ['Model', v.model]].map(([caption, value]) => ({ caption, kind: 'text', decodedBy: 'vin', decoded: value == null ? '' : String(value) }))];
      }
      r.roundTrip();
    };
    // A field a lookup draws is hidden until that lookup ran on this page (when the page has its button).
    const awaitsLookup = (f) => f.revealedBy && !store(window.replay.page).lookups?.has(f.revealedBy);

    window.replay.render = function render() {
      const r = window.replay;
      if (r.form) r.form.destroy();
      r.form = Ext.create('Ext.form.Panel', {
        renderTo: 'form', border: false, width: 600, defaults: { width: 580 },
        // `showAfter`: the question only appears once that row's button was clicked (cargo after "+").
        // `showWhen`: only while its trigger has an answer it was seen showing with (show-when.js).
        items: r.fields.flatMap((f, i) => (f.showAfter && !r.clicks.some((c) => c.page === r.page && c.row === f.showAfter) || awaitsLookup(f)
          || !replayShows(f, r.fields, (t, j) => store(r.page).texts[idFor(t, j).key] ?? (t.kind === 'checkbox' ? 'unchecked' : undefined)) ? [] : [
          { xtype: 'component', cls: 'caption', html: `${Ext.htmlEncode(captionOf(f) || '(no caption)')}${f.showWhen ? `<span class="tag">follow-up: ${Ext.htmlEncode(f.showWhen.caption)} = ${Ext.htmlEncode(f.showWhen.is.join(' / '))}</span>` : f.cond ? '<span class="tag">follow-up</span>' : ''}` },
          fieldConfig(f, i),
        ])),
      });
      // Page buttons (from the layout), then navigation.
      if (r.buttonsPanel) r.buttonsPanel.destroy();
      const buttons = (r.pageButtons ?? []).map((b) => (b.row
        ? { xtype: 'container', layout: 'hbox', items: [{ xtype: 'component', html: `${Ext.htmlEncode(b.row)}&nbsp;&nbsp;`, width: 220 }, { xtype: 'button', text: b.text, handler: () => r.click(b.text, b.row) }] }
        : { xtype: 'button', text: b.text, handler: () => r.click(b.text) }));
      r.buttonsPanel = Ext.create('Ext.container.Container', {
        renderTo: 'buttons', layout: { type: 'vbox', align: 'left' }, defaults: { margin: '4 0' },
        items: [
          ...buttons,
          { xtype: 'container', layout: 'hbox', margin: '16 0 0 0', items: [
            { xtype: 'button', text: 'Continue ›', handler: () => r.click('Continue ›') },
            { xtype: 'component', width: 24 },
            ...(document.body.classList.contains('bakeoff') ? [{ xtype: 'button', text: 'Next page ›', handler: () => r.nextPage() }] : []),
          ] },
        ],
      });
    };

    // Every answer goes to the "server": mask, wait, redraw (new DOM), like Duck Creek.
    window.replay.roundTrip = function roundTrip() {
      window.replay.form.mask('Loading...');
      setTimeout(window.replay.render, 250);
    };
  </script>

  <script type="module">
    import * as pdfjs from '/lib/pdf.min.mjs';
    import { readIntakeFields } from '/src/intake.js';
    import { normalizeIntake } from '/src/normalize.js';
    import { buildPlan } from '/src/plan.js';
    import { CARRIERS } from '/src/carriers.js';

    pdfjs.GlobalWorkerOptions.workerSrc = '/lib/pdf.worker.min.mjs';
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const params = new URLSearchParams(location.search);
    const bakeoff = params.get('bakeoff') === '1';
    if (bakeoff) document.body.classList.add('bakeoff');
    let layout = null;
    let runner = params.get('runner') ?? (bakeoff ? 'agent' : 'extension');

    // The replays are Progressive's layouts: its page adapter goes in before the engine, as the panel does it.
    for (const file of ['field-key.js', 'carriers/progressive.js', 'pagekit.js']) {
      await new Promise((res) => { const s = document.createElement('script'); s.src = `/src/content/${file}`; s.onload = res; document.head.append(s); });
    }

    async function intakeRecord() {
      const file = $('pdf').files[0];
      const bytes = file ? new Uint8Array(await file.arrayBuffer()) : new Uint8Array(await (await fetch('/test/fixtures/sample-intake.pdf')).arrayBuffer());
      const result = normalizeIntake(await readIntakeFields(pdfjs, bytes));
      if (result.error) throw new Error(result.error);
      // The quote's state is the layout's: Progressive quotes a client in their garaging state, and
      // some answers are a state's (Florida's PIP).
      if (layout?.context?.state) result.record.garaging = { ...result.record.garaging, state: layout.context.state };
      // An intake chosen here is replayed with its own vehicles, which must find their rows: as many
      // as the layout's quote had (the rest match no row). The sample takes the layout's units.
      if (!file) return replayWithUnits(result.record, layout?.context, window.replay.units?.list);
      const count = layout?.context?.vehicles;
      return Number.isInteger(count) && count > 0 && count < (result.record.vehicles?.length ?? 0) ? { ...result.record, vehicles: result.record.vehicles.slice(0, count) } : result.record;
    }

    async function load() {
      $('status').textContent = 'Loading…';
      layout = await (await fetch($('layout').value)).json();
      window.replay.units = replayUnitRows(layout);
      window.replay.byPage = {};
      window.replay.clicks = [];
      $('page').replaceChildren(...Object.keys(layout.pages).map((p) => new Option(p, p)));
      showPage(Object.keys(layout.pages)[0]);
      $('status').textContent = bakeoff ? 'Press Start when you begin.' : (layout.name ?? layout.carrier);
    }

    function showPage(name) {
      $('page').value = name;
      $('page-title').textContent = name;
      const buttons = layout.pages[name].buttons ?? [];
      // With a Verify DOT button on the page, the registered record's questions wait for it.
      const fields = (layout.pages[name].fields ?? []).map((f) => (buttons.some((b) => lookupOf(b.text) === 'dot') && dotResult(f) ? { ...f, revealedBy: 'dot' } : f));
      window.replay.applyDefaults(name, fields);
      Object.assign(window.replay, { page: name, fields, pageButtons: buttons });
      // The fill engine reads the page name from the URL, as on Progressive.
      const u = new URL(location.href);
      u.searchParams.set('pageName', name);
      history.replaceState(null, '', u);
      window.replay.render();
    }
    window.replay.nextPage = () => {
      const pages = Object.keys(layout.pages);
      const i = pages.indexOf(window.replay.page);
      if (i < pages.length - 1) showPage(pages[i + 1]);
      else $('status').textContent = 'Last page. Press "Finish & save results".';
    };

    function shownAnswers(page, texts) {
      const fields = layout?.pages?.[page]?.fields ?? [];
      const textOf = (t, j) => texts[idFor(t, j).key] ?? (t.kind === 'checkbox' ? 'unchecked' : undefined);
      const hidden = new Set(fields.map((f, i) => (replayShows(f, fields, textOf) ? null : idFor(f, i).key)).filter(Boolean));
      return Object.fromEntries(Object.entries(texts).filter(([q]) => !hidden.has(q)));
    }

    function results() {
      const r = window.replay;
      const finished = new Date();
      return {
        kind: 'bakeoff-result',
        runner,
        course: $('layout').value,
        startedAt: r.started?.toISOString() ?? null,
        finishedAt: finished.toISOString(),
        seconds: r.started ? Math.round((finished - r.started) / 1000) : null,
        // Only answers to questions the page shows at the end: a follow-up hidden by a later answer
        // keeps its old answer in the store (the agent may switch back), but not in the result.
        answers: Object.fromEntries(Object.entries(r.byPage).map(([page, s]) => [page, shownAnswers(page, s.texts)])),
        clicks: r.clicks,
      };
    }
    function save() {
      const data = results();
      window.replay.lastResults = data;
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
      const a = Object.assign(document.createElement('a'), { href: url, download: `bakeoff-${runner}-${Date.now()}.json` });
      a.click();
      $('status').textContent = `Saved ${a.download}${data.seconds != null ? ` (${data.seconds} s)` : ''}`;
    }

    // --- Extension run -----------------------------------------------------------------------
    const done = { actions: new Set(), pages: new Set() };
    async function fillPage(record) {
      const carrier = CARRIERS.find((c) => c.id === layout.carrier) ?? null;
      const plan = buildPlan(record, carrier, {});
      const before = window.__raterKit.capture(plan, []).controls;
      const r = await window.__raterKit.fill(plan, {
        replaceChoices: !!carrier?.replaceChoices,
        doneActions: [...done.actions], visitedPages: [...done.pages],
        advance: carrier?.advance ?? null,
      });
      r.actions.forEach((a) => done.actions.add(a.id));
      done.pages.add(window.replay.page);
      const how = (x) => (x.path?.startsWith(`${carrier?.id}.`) ? 'standard/computed' : 'intake');
      // Which rule filled it, never the page's question number (--renumber shifts those): its name,
      // the question id it was written for, and its intake path (a vehicle's row index included),
      // but not the plan-index path a rule without id or path gets (it shifts when a rule is added).
      const steps = new Map(plan.map((s) => [s.id, s]));
      const ruleOf = (x) => {
        const s = steps.get(x.stepId);
        return s ? [s.name, s.q ?? '', /^[^.[]+\.q[^.[]*$/.test(s.path ?? '') ? '' : s.path ?? ''].join(' | ') : '';
      };
      return {
        questions: before.length,
        filled: r.filled.map((x) => ({ label: x.label, shown: x.shown, how: how(x), rule: ruleOf(x) })),
        clicked: [...r.actions.map((a) => a.text), ...(r.advanced ? [r.advanced] : [])],
        noData: r.noData.map((x) => x.label + (x.note ? ` (${x.note})` : '')),
        failed: r.failed.map((x) => `${x.label}: ${x.reason}`),
        unmapped: before.filter((c) => !c.wouldFill).map((c) => c.label),
        // What kept the page from being continued (the panel's "needs you" list).
        blockers: [...r.blockers],
      };
    }

    function reportRows(rows) {
      const list = (xs) => (xs.length ? `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<span class="muted">–</span>');
      const total = (k) => rows.reduce((n, r) => n + (Array.isArray(r[k]) ? r[k].length : r[k]), 0);
      $('report').innerHTML = `
        <p><b>${total('filled')} of ${total('questions')} questions filled</b> across ${rows.length} page(s) ·
          ${total('clicked')} buttons clicked · ${total('noData')} not on intake · ${total('failed')} failed · ${total('unmapped')} with no rule</p>
        <table><thead><tr><th>Page</th><th class="num">Qs</th><th class="num">Filled</th><th>Clicked</th><th>Failed</th><th>No rule</th><th>Not on intake</th></tr></thead>
        <tbody>${rows.map((r) => `<tr><td>${esc(r.page)}</td><td class="num">${r.questions}</td><td class="num">${r.filled.length}</td>
          <td>${list(r.clicked)}</td><td class="err">${list(r.failed)}</td><td>${list(r.unmapped)}</td><td>${list(r.noData)}</td></tr>`).join('')}</tbody></table>`;
      window.replay.lastReport = rows;
    }

    async function run(all) {
      const own = [...document.querySelectorAll('header input, header select, header button')];
      own.forEach((el) => { el.disabled = true; });
      try {
        $('status').textContent = 'Reading intake…';
        const record = await intakeRecord();
        window.replay.record = record;
        const pages = all ? Object.keys(layout.pages) : [window.replay.page];
        if (all) { window.replay.started = new Date(); done.actions.clear(); done.pages.clear(); }
        const rows = [];
        for (const p of pages) {
          $('status').textContent = `Filling ${p}…`;
          if (all) showPage(p);
          rows.push({ page: p, ...(await fillPage(record)) });
        }
        reportRows(rows);
        $('status').textContent = 'Done';
      } catch (e) {
        $('status').textContent = `Error: ${e.message}`;
      } finally {
        own.forEach((el) => { el.disabled = false; });
      }
    }

    $('load').addEventListener('click', load);
    $('page').addEventListener('change', (e) => showPage(e.target.value));
    $('fill-one').addEventListener('click', () => run(false));
    $('fill-all').addEventListener('click', () => run(true));
    $('save').addEventListener('click', save);
    $('start').addEventListener('click', () => { window.replay.started = new Date(); $('start').disabled = true; $('status').textContent = 'Started. Go through every page with "Next page ›".'; });
    Ext.onReady(() => {
      const fromUrl = params.get('layout');
      if (fromUrl) $('layout').value = fromUrl;
      load();
    });
    Object.assign(window.replay, { run, results, save, setRunner: (r) => { runner = r; } });
  </script>
</body>
</html>
