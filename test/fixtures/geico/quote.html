mplate shadowrootmode="open" shadowrootclonable=""> <slot name="icon"></slot> <div class="component-header-text"> <h3><slot></slot></h3> <slot name="subtext"></slot> </div> </template>  <slot></slot> <div slot="subtext"><slot name="subtext"></slot></div> </gds-component-header> </template>Optional 12 Mo. GEICO Commercial Policy Add-Ons</gds-section-header></div></div><div><div class="cards-container content-card"><div class="card"><div class="card-header bg-gradient"><div class="card-header-info"><span class="geico-icon icon-coverage"></span><div class="card-header-title"><span></span></div></div></div><div class="card-content"><ul id="expandable-form-Id_CoveragePackageCollectionWrap_61117" class="expandable-form expandable-form--view-only"><li id="Id_MtcCoverageQuestionsComboActivityData_87810" class="expandable-form expandable-form--view-only"><div class="sales-expandable-coverages expandable-form-headline"><div class="expandable-form-content-wrapper"><div class="expandable-left-content-wrapper"><div class="left-side left-with-subtext"><p class="h4">Motor Truck Cargo</p><p>Covers the value of cargo that's lost or damaged while in transit.</p></div></div><div class="expandable-right-content-wrapper"><div class="right-side"><span class="expandable-form-control expandable-form-view-icon geico-icon--actionable geico-icon icon-chevron-down" data-testid="editIcon" tabindex="0"></span></div></div></div></div><div class="expandable-form-content-container  view-only" aria-hidden="true"><div class="sales-expandable-form-contents"><div id="Id_f6a882f470714910892aa0756fa8bc66"><div class=""><gds-radio-button-group id="Id_GiveMtcEligibleRequireCoverageYesNo_11139" group-id="Id_GiveMtcEligibleRequireCoverageYesNo_11139-shadow" fieldset-aria-labelledby="Id_GiveMtcEligibleRequireCoverageYesNo_11139" layout="grid" layout-sm="1" layout-md="2" layout-lg="2" full-width="" variant="With Card" active-index="1" size="large" style="--grid-columns-sm: 1; --grid-columns-md: 2; --grid-columns-lg: 2;"><template shadowrootmode="open" shadowrootclonable=""> <fieldset id="Id_GiveMtcEligibleRequireCoverageYesNo_11139-shadow" aria-labelledby="Id_GiveMtcEligibleRequireCoverageYesNo_11139" data-qm-encrypt="false" data-qm-mask="false"> <gds-label-legend element="legend" for="input-id" size="large"><template shadowrootmode="open" shadowrootclonable=""><legend class="label-legend"> <slot></slot>   <slot name="description" class="gds-empty-slot"></slot> </legend></template> <slot name="legend"></slot> <span slot="description"><slot name="descriptive-copy"></slot></span> </gds-label-legend> <div class="radio-options-wrapper"> <slot id="items-slot"></slot> </div> <p class="error-message"> <slot name="error-message"></slot> </p> </fieldset> </template><span slot="legend"><span>Does the customer require Motor Truck Cargo Coverage?</span><gds-tooltip position="auto" size="large"><template shadowrootmode="open" shadowrootclonable=""> <button type="button" tabindex="0" aria-label="View tooltip" class="gds-tooltip-trigger" aria-expanded="false"> <gds-icon icon-type="info-i" aria-hidden="true" size="medium" color="default"><template shadowrootmode="open" shadowrootclonable=""> <span class="geico-icon icon-info-i" color="default"></span> </template></gds-icon> </button>  <gds-show-hide><template shadowrootmode="open" shadowrootclonable=""><slot></slot></template> <div> <gds-button appearance="tertiary" type="button" reverse-color="" size="small" aria-label="Close tooltip" class="no-text"><template shadowrootmode="open" shadowrootclonable=""> <button type="button" aria-disabled="false" aria-busy="false"> <slot name="left-visual"></slot> <span>  <slot></slot> </span> <slot name="right-visual"></slot>  </button> </template> <gds-icon icon-type="close" slot="left-visual" size="small" color="default"><template shadowrootmode="open" shadowrootclonable=""> <span class="geico-icon icon-close" color="default"></span> </template></gds-icon> </gds-button> <div tabindex="0"> <slot></slot> </div> </div> </gds-show-hide> </template><p>What is Motor Truck Cargo? Motor Truck Cargo coverage pays when the customer is responsible for loss of or damage to cargo they are hauling for someone else, under a bill of lading or similar shipping document, due to perils like fire, collision or striking of the load. The customer is protected when the cargo is in their physical custody and control while in the course of transit or during loading or unloading. Motor Truck Cargo also pays for losses to electronic business equipment due to covered perils, including electronic logging devices, fleet tracking devices and dash cams that are not permanently installed in or on the vehicle.</p> <p>What are Motor Truck Cargo exclusions and excluded commodities? Some common exclusions apply and are detailed in the customer’s Motor Truck Cargo policy. Certain commodities are also excluded from coverage including art; jewelry; precious and semi-precious metals; furs or garments trimmed in fur; money and securities of any kind; valuable papers; pharmaceuticals, tobacco, marijuana products and alcohol; contraband; explosives; mobile and modular homes; and any property not listed on a bill of lading or similar shipping document. Some exclusions also apply for live animals.</p> <p>What is Refrigeration Breakdown coverage? Refrigeration Breakdown coverage is available on certain business and vehicle types. Refrigeration Breakdown is an endorsement to Motor Truck Cargo. It provides liability protection for cargo losses due to spoilage or change in temperature as a result of sudden and accidental breakdown of refrigeration or heating units on an insured vehicle. A $2,500 deductible applies to losses covered under Motor Truck Cargo with Refrigeration Breakdown.</p> <p>Why does the customer need this? Shippers of goods will often require truckers to insure their cargo. By purchasing Motor Truck Cargo coverage the customer can meet that requirement and protect themselves when they are responsible for damage to or loss of cargo from fire, collision or striking of a load. If the customer is hauling goods requiring a temperature-controlled environment, they may also need Refrigeration Breakdown coverage to protect themselves from losses caused by sudden and accidental breakdown of refrigeration or heating units.</p></gds-tooltip></span><gds-radio-button id="Id_GiveMtcEligibleRequireCoverageYesNo_111390" input-id="Id_GiveMtcEligibleRequireCoverageYesNo_111390-shadow" name="Id_GiveMtcEligibleRequireCoverageYesNo_11139" value="Yes" has-description=""><template shadowrootmode="open" shadowrootclonable=""> <div class="radio-button"> <div class="full-content-wrapper"> <div class="child-wrapper "> <div class="input-circle"> <input tabindex="0" id="Id_GiveMtcEligibleRequireCoverageYesNo_111390-shadow" name="Id_GiveMtcEligibleRequireCoverageYesNo_11139" type="radio" class="gds-radio-input" aria-invalid="false" value="Yes"> <span class="checkmark"></span> </div> <div class="label-wrapper">  <label class="text-wrapper" for="Id_GiveMtcEligibleRequireCoverageYesNo_111390-shadow"> <slot name="label"></slot> <slot name="description"></slot> </label> </div> <div class="right-content-wrapper"> <slot name="right-content"></slot> </div> </div> <gds-utils-expand-collapse><template shadowrootmode="open" shadowrootclonable=""> <div class="content"> <slot></slot> </div> </template> <div class="expandable-content"> <div class="text-section"> <slot name="expandable-header"></slot> <slot name="expandable-description"></slot> </div> <div class="link-section"> <slot name="expandableLink"></slot> </div> </div> </gds-utils-expand-collapse> </div> </div> </template><span slot="label">Yes</span><span slot="description"></span></gds-radio-button><gds-radio-button id="Id_GiveMtcEligibleRequireCoverageYesNo_111391" input-id="Id_GiveMtcEligibleRequireCoverageYesNo_111391-shadow" name="Id_GiveMtcEligibleRequireCoverageYesNo_11139" value="No" has-description="" checked=""><template shado rror-message"></slot> </p> </fieldset> </template><span slot="legend"><span>Does the customer need Hired Auto?</span><gds-tooltip position="auto" size="large"><template shadowrootmode="open" shadowrootclonable=""> <button type="button" tabindex="0" aria-label="View tooltip" class="gds-tooltip-trigger" aria-expanded="false"> <gds-icon icon-type="info-i" aria-hidden="true" size="medium" color="default"><template shadowrootmode="open" shadowrootclonable=""> <span class="geico-icon icon-info-i" color="default"></span> </template></gds-icon> </button>  <gds-show-hide><template shadowrootmode="open" shadowrootclonable=""><slot></slot></template> <div> <gds-button appearance="tertiary" type="button" reverse-color="" size="small" aria-label="Close tooltip" class="no-text"><template shadowrootmode="open" shadowrootclonable=""> <button type="button" aria-disabled="false" aria-busy="false"> <slot name="left-visual"></slot> <span>  <slot></slot> </span> <slot name="right-visual"></slot>  </button> </template> <gds-icon icon-type="close" slot="left-visual" size="small" color="default"><template shadowrootmode="open" shadowrootclonable=""> <span class="geico-icon icon-close" color="default"></span> </template></gds-icon> </gds-button> <div tabindex="0"> <slot></slot> </div> </div> </gds-show-hide> </template><p><b>What is Hired Autos coverage?</b><br> Hired Autos coverage provides insurance for vehicles that the customer leases, hires, rents or borrows for business purposes. However, hired Auto coverage does not apply to vehicles the customer leases, hires, rents or borrows with a driver. The commercial auto insurance policy must include primary liability coverage, and additional restrictions may apply based on the type of business. We may request copies of financial statements showing total cost of hire for the prior year. We may also audit the cost of hire and charge appropriately for the additional premium for up to 3 years after the policy expiration.</p> <p><b>Why does the c Motor Truck General Liability</p><p>Covers injuries or property damage related to your business activities.</p></div></div><div class="expandable-right-content-wrapper"><div class="right-side"><span class="expandable-form-control expandable-form-view-icon geico-icon--actionable geico-icon icon-chevron-down" data-testid="editIcon" tabindex="0"></span></div></div></div></div><div class="expandable-form-content-container  view-only" aria-hidden="true"><div class="sales-expandable-form-contents"><div id="Id_146abc3187844558afbc6d3768525406"><div class=""><gds-radio-button-group id="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_15712" group-id="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_15712-shadow" fieldset-aria-labelledby="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_15712" layout="grid" layout-sm="1" layout-md="2" layout-lg="2" full-width="" variant="With Card" active-index="1" size="large" style="--grid-columns-sm: 1; --grid-columns-md: 2; --grid-columns-lg: 2;"><template shadowrootmode="open" shadowrootclonable=""> <fieldset id="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_15712-shadow" aria-labelledby="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_15712" data-qm-encrypt="false" data-qm-mask="false"> <gds-label-legend element="legend" for="input-id" size="large"><template shadowrootmode="open" shadowrootclonable=""><legend class="label-legend"> <slot></slot>   <slot name="description" class="gds-empty-slot"></slot> </legend></template> <slot name="legend"></slot> <span slot="description"><slot name="descriptive-copy"></slot></span> </gds-label-legend> <div class="radio-options-wrapper"> <slot id="items-slot"></slot> </div> <p class="error-message"> <slot name="error-message"></slot> </p> </fieldset> </template><span slot="legend"><span>Does the customer need Motor Truck General Liability?</span><gds-tooltip position="auto" size="large"><template shadowrootmode="open" shadowrootclonable=""> <button type="button" tabindex="0" aria-label="View tooltip" class="gds-tooltip-trigger" aria-expanded="false"> <gds-icon icon-type="info-i" aria-hidden="true" size="medium" color="default"><template shadowrootmode="open" shadowrootclonable=""> <span class="geico-icon icon-info-i" color="default"></span> </template></gds-icon> </button>  <gds-show-hide><template shadowrootmode="open" shadowrootclonable=""><slot></slot></template> <div> <gds-button appearance="tertiary" type="button" reverse-color="" size="small" aria-label="Close tooltip" class="no-text"><template shadowrootmode="open" shadowrootclonable=""> <button type="button" aria-disabled="false" aria-busy="false"> <slot name="left-visual"></slot> <span>  <slot></slot> </span> <slot name="right-visual"></slot>  </button> </template> <gds-icon icon-type="close" slot="left-visual" size="small" color="default"><template shadowrootmode="open" shadowrootclonable=""> <span class="geico-icon icon-close" color="default"></span> </template></gds-icon> </gds-button> <div tabindex="0"> <slot></slot> </div> </div> </gds-show-hide> </template><p><b>What is Motor Truck General Liability?</b><br> Motor Truck General Liability coverage protects the customer’s business when they are legally liable for damages caused by an accident arising out of their business operations but not directly involving the insured vehicle. Motor Truck General Liability covers bodily injury, property damage, personal and advertising injury liability, and medical payments. Coverage is available to for-hire trucking businesses that earn all of their income from hauling goods for others for a fee. The commercial auto insurance policy must also include primarily liability coverage, and additional restrictions may apply based on the type of business and vehicles listed on the policy.</p> <p><b>Why does the customer need this?</b><br> Risk managers often require truckers to carry General Liability coverage. If the customer’s business operations result in them being legally responsible for injury or damages to someone else, they may be required to pay for the person's loss. General liability coverage helps protect the customer’s assets by covering the injured party's losses and expenses. It also covers legal defense if the customer is sued as the result of an accident. Some common exclusions apply that will be detailed in the customer’s policy.</p></gds-tooltip></span><gds-radio-button id="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_157120" input-id="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_157120-shadow" name="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_15712" value="Yes" has-description=""><template shadowrootmode="open" shadowrootclonable=""> <div class="radio-button"> <div class="full-content-wrapper"> <div class="child-wrapper "> <div class="input-circle"> <input tabindex="0" id="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_157120-shadow" name="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_15712" type="radio" class="gds-radio-input" aria-invalid="false" value="Yes"> <span class="checkmark"></span> </div> <div class="label-wrapper">  <label class="text-wrapper" for="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_157120-shadow"> <slot name="label"></slot> <slot name="description"></slot> </label> </div> <div class="right-content-wrapper"> <slot name="right-content"></slot> </div> </div> <gds-utils-expand-collapse><template shadowrootmode="open" shadowrootclonable=""> <div class="content"> <slot></slot> </div> </template> <div class="expandable-content"> <div class="text-section"> <slot name="expandable-header"></slot> <slot name="expandable-description"></slot> </div> <div class="link-section"> <slot name="expandableLink"></slot> </div> </div> </gds-utils-expand-collapse> </div> </div> </template><span slot="label">Yes</span><span slot="description"></span></gds-radio-button><gds-radio-button id="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_157121" input-id="Id_GiveMotorTruckGeneralLiabilityCoverageRequired_157121-shadow" name=
