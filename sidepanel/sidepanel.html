<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rater Autofill</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="brain" viewBox="0 0 24 24">
      <path d="M12 18V5a3 3 0 0 0-5.8-1.1A4 4 0 0 0 3 10a4 4 0 0 0 .8 7.6A4 4 0 0 0 12 18Zm0 0V5a3 3 0 0 1 5.8-1.1A4 4 0 0 1 21 10a4 4 0 0 1-.8 7.6A4 4 0 0 1 12 18Z"/>
      <path d="M8 3.5A3 3 0 0 0 9 8m-6 2a4 4 0 0 1 3-.5m-2.2 8.1A4 4 0 0 1 8 14m8-10.5A3 3 0 0 1 15 8m6 2a4 4 0 0 0-3-.5m2.2 8.1A4 4 0 0 0 16 14"/>
    </symbol>
    <symbol id="gear" viewBox="0 0 24 24">
      <path d="m9.5 3-.5 2a7 7 0 0 0-1.5.9l-2-.6-2.5 4.4 1.5 1.4a8 8 0 0 0 0 1.8L3 14.3l2.5 4.4 2-.6A7 7 0 0 0 9 19l.5 2h5l.5-2a7 7 0 0 0 1.5-.9l2 .6 2.5-4.4-1.5-1.4a8 8 0 0 0 0-1.8L21 9.7l-2.5-4.4-2 .6A7 7 0 0 0 15 5l-.5-2Z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="new-window" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8 8"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="dock-in" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16M6 12h6M10 9.5l2.5 2.5-2.5 2.5"/></symbol>
    <symbol id="card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="8.5" cy="11" r="2"/><path d="M5.5 16a3.2 3.2 0 0 1 6 0M14 10h4.5M14 13.5h3"/></symbol>
    <!-- The client strip's tools: Change file, New quote with this intake, Clear this client. -->
    <symbol id="file-in" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M12 11v7M9 15l3 3 3-3"/></symbol>
    <symbol id="restart" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></symbol>
  </svg>

  <h1 class="sr-only">TNI Rater Autofill</h1>

  <!-- Where the panel works: the rater page's carrier, page and place in the quote (the panel's own
       name off a rater), with Settings on its right. -->
  <header class="top">
    <div class="top-main">
      <div id="carrier-line" class="carrier-line">
        <img id="site-logo" class="rater-logo" alt="" hidden>
        <span id="site" class="site">…</span>
        <span id="site-step" class="site-step" hidden></span>
      </div>
      <div class="track-row">
        <div id="site-track" class="track" hidden></div>
        <span id="site-count" class="site-count" hidden></span>
      </div>
      <div id="brand" class="brand" hidden><img src="logo.png" alt=""><span>Rater Autofill</span></div>
      <span id="site-caption" class="carrier-caption" hidden></span>
    </div>
    <span class="top-right">
      <!-- The panel in a window of its own (popOut), and back to Chrome's side panel (dock). -->
      <button type="button" id="pop-out" class="icon-btn" aria-label="Open in its own window" title="Open in its own window" hidden><svg aria-hidden="true"><use href="#new-window"/></svg></button>
      <button type="button" id="dock-back" class="icon-btn" aria-label="Back to the side panel" title="Back to the side panel" hidden><svg aria-hidden="true"><use href="#dock-in"/></svg></button>
      <button type="button" id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings" aria-expanded="false" aria-controls="settings"><svg aria-hidden="true"><use href="#gear"/></svg><span id="settings-dot" class="dot" hidden></span></button>
    </span>
  </header>

  <!-- The client: their name (a button to every answer on the intake), the intake PDF, the file tools
       always in view (no menu to open first), and the three steps as a strip -->
  <section id="quote" class="client" hidden>
    <!-- The name, the tools, the file tools' question and the note on the file just loaded: drawn by
         client-view.jsx (mountClient). -->
    <div id="client-root"></div>
    <!-- The intake, then the page in front: filled, then reviewed. Each page has its own 2 and 3;
         the header's "Step n of m" is the quote's place. Drawn by steps-view.jsx (mountSteps). -->
    <nav id="steps" class="steps" aria-label="Steps"></nav>
  </section>

  <main id="view" class="view">
    <div id="notices" class="notices"></div>
    <!-- Pop out or Back to the side panel that didn't work (windowProblem). -->
    <div id="window-note" class="notices" hidden></div>

    <!-- No intake loaded -->
    <section id="home" class="pane">
      <div class="intro">
        <h2>Start a quote</h2>
        <p class="muted">Add the client’s quote application.</p>
      </div>
      <section id="load" class="drop" tabindex="0">
        <input id="file" type="file" accept="application/pdf,.pdf" hidden>
        <div><h3 class="drop-title">Drop your intake PDF here</h3><p class="drop-hint">or</p></div>
        <button type="button" id="choose" class="primary">Choose a PDF</button>
      </section>
      <p class="privacy-line">Stays on this computer. Cleared when Chrome closes.</p>
      <div id="load-error" class="issue bad" role="alert" hidden></div>
    </section>

    <!-- Step 1: what looked wrong or missing on the intake (#warnings), then every answer on it
         (#details-row): drawn by checks-view.jsx (mountChecks). -->
    <section id="check-view" class="pane" hidden></section>

    <!-- Steps 2 and 3: the page's answers, one list -->
    <section id="page-view" hidden>
      <!-- A rater to open, and what's wrong or different about this tab's quote, above its answers
           (#fill-waiting, #issues): drawn by cards-view.jsx (mountCards). -->
      <div id="cards-root"></div>
      <!-- Which driver, vehicle or trailer the page is about: drawn by checks-view.jsx (mountPickers). -->
      <div id="pickers" class="pickers"></div>
      <!-- The page's answers (#feed), drawn by feed-view.jsx (mountFeed). -->
      <div id="feed-root"></div>
    </section>

    <!-- Settings, over everything but the header: drawn by settings-view.jsx (mountSettings). -->
    <section id="settings" class="pane settings" hidden></section>
  </main>

  <!-- The intake PDF in a sheet over the panel, with what a check item or an answer refers to marked.
       Drawn by pdf-sheet-view.jsx (mountPdf). -->
  <div id="pdf-view" class="sheet" hidden></div>

  <!-- Every answer on the intake, to read or correct, in a drawer from the right over the panel.
       Drawn by details-view.jsx (mountDetails). -->
  <div id="details-view" class="drawer" hidden></div>

  <!-- What to do next, always in the same place, and the panel's own links -->
  <footer class="foot">
    <!-- The dock (#dock), drawn by steps-view.jsx (mountDock). -->
    <div id="dock-root" class="dock-root"></div>
    <div id="problem-form" class="problem" hidden>
      <textarea id="problem-text" rows="3" placeholder="What went wrong? No client names, numbers or addresses." aria-label="What went wrong"></textarea>
      <div class="problem-actions">
        <button type="button" id="cancel-problem" class="ghost small-btn">Cancel</button>
        <button type="button" id="send-problem" class="primary small-btn">Save report</button>
      </div>
    </div>
    <div class="foot-row">
      <button type="button" id="report-problem" class="link small" aria-expanded="false" aria-controls="problem-form">Report a problem</button>
      <!-- "Recording usage" (#recording), drawn by settings-view.jsx (mountRecordingLine). -->
      <span id="recording-root" class="recording-root"></span>
      <span id="foot-version" class="foot-version"></span>
    </div>
  </footer>

  <!-- Fill results and changed counts, read out by screen readers (announce). -->
  <div id="announce" class="sr-only" role="status" aria-live="polite"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
