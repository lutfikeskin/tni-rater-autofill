# Every morning: download the agents' usage log from the central server (Railway), build the
# review (problem reports, AI decisions, speed, rule suggestions, page layouts) for the last day,
# keep it as an artifact, and open an issue when agents reported problems, live pages show
# questions no rule claims, or the deployed usage server isn't this repository's (it would drop
# fields the extension sends).
# Needs the repository secret RATER_ADMIN_TOKEN (the server's admin token).
name: Daily review

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 09:00 Istanbul, after US agents' day
  workflow_dispatch:
    inputs:
      since:
        description: 'Review events since (YYYY-MM-DD); blank = yesterday'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # First, so a server that is down is still reported (the download would stop the job). Only
      # the default branch is what's deployed: a run on another branch doesn't compare.
      - name: Check the usage server
        id: server
        run: |
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            node scripts/server-check.mjs --md server-check.md | tee server-check.log
          else
            echo "server: skipped · run on $GITHUB_REF_NAME, not the default branch" | tee server-check.log
          fi
          echo "status=$(sed -E 's/^server: ([a-z]+).*/\1/' server-check.log)" >> "$GITHUB_OUTPUT"
      - name: Download the usage log
        env:
          RATER_ADMIN_TOKEN: ${{ secrets.RATER_ADMIN_TOKEN }}
        run: npm run pull
      - name: Build the review
        id: review
        run: |
          SINCE="${{ github.event.inputs.since }}"
          [ -n "$SINCE" ] || SINCE=$(date -u -d yesterday +%F)
          node scripts/review.mjs server-data --since "$SINCE" --out "reviews/review-$(date -u +%F).md" | tee review.log
          echo "file=reviews/review-$(date -u +%F).md" >> "$GITHUB_OUTPUT"
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"
          echo "problems=$(grep -o '[0-9]* problem reports' review.log | grep -o '^[0-9]*' || echo 0)" >> "$GITHUB_OUTPUT"
          # Whether the deployed server is this repository's (the first step): else it may drop fields.
          if [ -f server-check.md ]; then cat server-check.md >> "reviews/review-$(date -u +%F).md"; fi
          # Questions met on live pages that no rule claims (a missing rule or a changed page).
          echo "norule=$(node scripts/coverage.mjs server-data --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).reduce((n,r)=>n+r.totals.none+r.totals.notInMock,0)))')" >> "$GITHUB_OUTPUT"
          head -c 60000 "reviews/review-$(date -u +%F).md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ steps.review.outputs.since }}
          path: ${{ steps.review.outputs.file }}
          retention-days: 90
      - name: Open an issue for problem reports, uncovered questions or a server to redeploy
        if: steps.review.outputs.problems != '0' || steps.review.outputs.norule != '0' || (steps.server.outputs.status != 'same' && steps.server.outputs.status != 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head -c 60000 "${{ steps.review.outputs.file }}" > body.md
          gh issue create --title "Daily review since ${{ steps.review.outputs.since }}: ${{ steps.review.outputs.problems }} problem report(s), ${{ steps.review.outputs.norule }} question(s) without a rule, usage server ${{ steps.server.outputs.status }}" --body-file body.md --label daily-review || \
          gh issue create --title "Daily review since ${{ steps.review.outputs.since }}: ${{ steps.review.outputs.problems }} problem report(s), ${{ steps.review.outputs.norule }} question(s) without a rule, usage server ${{ steps.server.outputs.status }}" --body-file body.md
      # The download or the review failed (the usage server down, a broken script): say so, with
      # what the server check found.
      - name: Open an issue when the review could not run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "The daily review could not run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > failed.md
          if [ -f server-check.log ]; then echo >> failed.md; cat server-check.log >> failed.md; fi
          gh issue create --title "Daily review could not run ($(date -u +%F)): usage server ${{ steps.server.outputs.status || 'not checked' }}" --body-file failed.md --label daily-review || \
          gh issue create --title "Daily review could not run ($(date -u +%F)): usage server ${{ steps.server.outputs.status || 'not checked' }}" --body-file failed.md
