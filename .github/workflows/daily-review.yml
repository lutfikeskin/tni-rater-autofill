# Every morning: download the agents' usage log from the central server (Railway), build the
# review (problem reports, AI decisions, speed, rule suggestions, page layouts) of what arrived
# since the last successful run, keep it as an artifact, and comment on the open daily-review
# issue (or open one) when something is new: problem reports, questions without a rule first
# seen, a deployed usage server that isn't this repository's (it would drop fields the extension
# sends), or a run that failed. The decisions are in scripts/daily-issue.mjs and scripts/lib/daily.mjs.
# Needs the repository secret RATER_ADMIN_TOKEN (the server's admin token).
name: Daily review

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 09:00 Istanbul, after US agents' day
  workflow_dispatch:
    inputs:
      since:
        description: 'Review events received since (YYYY-MM-DD or an ISO time); blank = since the last successful run'
        required: false

permissions:
  contents: read
  issues: write
  actions: read   # gh run list: where the last successful run started

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # First, so a server that is down is still reported (the download would stop the job). Only
      # the default branch is what's deployed: a run on another branch doesn't compare.
      - name: Check the usage server
        id: server
        run: |
          if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            node scripts/server-check.mjs --md server-check.md | tee server-check.log
          else
            echo "server: skipped · run on $GITHUB_REF_NAME, not the default branch" | tee server-check.log
          fi
          echo "status=$(sed -E 's/^server: ([a-z]+).*/\1/' server-check.log)" >> "$GITHUB_OUTPUT"
          echo "note=$(sed -E 's/^server: [a-z]+ · //' server-check.log)" >> "$GITHUB_OUTPUT"
      - name: Download the usage log
        env:
          RATER_ADMIN_TOKEN: ${{ secrets.RATER_ADMIN_TOKEN }}
        run: npm run pull
      - name: Build the review
        id: review
        env:
          SINCE_INPUT: ${{ github.event.inputs.since }}
        run: |
          SINCE="$SINCE_INPUT"
          [ -n "$SINCE" ] || SINCE=$(node scripts/daily-issue.mjs since)
          FILE="reviews/review-$(date -u +%F).md"
          node scripts/review.mjs server-data --since "$SINCE" --out "$FILE" --summary review-summary.json | tee review.log
          # Whether the deployed server is this repository's (the first step): else it may drop fields.
          if [ -f server-check.md ]; then cat server-check.md >> "$FILE"; fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          head -c 60000 "$FILE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: review-${{ steps.review.outputs.day }}
          path: ${{ steps.review.outputs.file }}
          retention-days: 90
      - name: Comment on the daily review issue when something is new
        env:
          SERVER_STATUS: ${{ steps.server.outputs.status }}
          SERVER_NOTE: ${{ steps.server.outputs.note }}
        run: node scripts/daily-issue.mjs post --summary review-summary.json --server "$SERVER_STATUS" --server-note "$SERVER_NOTE" --run-url "$RUN_URL"
      # The download or the review failed (the usage server down, a broken script): say so on the
      # same issue, with what the server check found.
      - name: Say the review could not run
        if: failure()
        env:
          SERVER_STATUS: ${{ steps.server.outputs.status || 'not checked' }}
          SERVER_NOTE: ${{ steps.server.outputs.note }}
        run: node scripts/daily-issue.mjs post --failed --server "$SERVER_STATUS" --server-note "$SERVER_NOTE" --run-url "$RUN_URL"
