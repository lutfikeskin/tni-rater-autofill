# Claude reviews each pull request once, when it opens or leaves draft, and leaves inline comments
# plus one summary comment. It reads and comments only: it never pushes, approves or merges.
# To review again after more pushes, comment `@claude review` (claude.yml handles that); to have
# the findings fixed, comment `@claude fix the review comments`.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) and the Claude GitHub App.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write   # the action exchanges it for the Claude GitHub App's token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as the maintainer's second reviewer. Read the diff with
            `gh pr diff` and the description with `gh pr view`. Follow CLAUDE.md, and read only the
            docs/ files its table points to for the systems this diff touches.

            Look for, in order of importance:
            1. Wrong insurance answers: invented client facts or defaults presented as client facts;
               missing information, explicit No and not applicable treated as the same thing.
            2. Weakened safety: anything that could bind, purchase, submit, order reports or sign;
               lost agent corrections, answer-retention checks, review blockers or the approval hold.
            3. Leaks: client values, raw carrier pages or credentials in committed files or logs;
               harnesses that could upload to the production usage server.
            4. Correctness bugs: logic errors, unhandled failure paths, race conditions in the fill engine.
            5. AI work that moves mappings, calculations or execution from code into the model.
            6. Missing tests for changed behavior, and docs/README not updated when behavior,
               commands or data they describe changed (the PR's Docs section must say which).

            Post each finding as an inline comment on the exact line with
            mcp__github_inline_comment__create_inline_comment (confirmed: true). Start it with a
            severity, **Blocker**, **Should fix** or **Nit**, then the problem, why it matters and a
            concrete fix. Only comment on real problems in this diff; skip style preferences the
            codebase doesn't follow and anything you are unsure of.

            Then post one short summary with `gh pr comment`: a verdict (looks good / changes
            needed), the count of findings by severity, and anything you could not check. Do not
            repeat the inline comments, and never write the text "@claude" in any comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
