# Claude answers `@claude` in pull request and issue comments from people with write access:
# `@claude fix the review comments` on a PR pushes the fixes to that PR's branch, and
# `@claude review` reviews the PR again after new pushes. Comments from bots (including Claude's
# own review) never trigger it.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) and the Claude GitHub App.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# One run per PR or issue at a time; a later request waits instead of cancelling one that's pushing.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.user.type != 'Bot') ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # the action exchanges it for the Claude GitHub App's token
      actions: read     # lets Claude read CI results on the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # So Claude can run `npm test` before it pushes, as CLAUDE.md requires.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(npm test),Bash(node --test:*),Bash(npm run package),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
            --append-system-prompt "Follow CLAUDE.md. When fixing review comments, read every unresolved review comment on the PR (gh api repos/OWNER/REPO/pulls/N/comments), fix each one you agree with, and say which ones you did not change and why. Run npm test before pushing and report the result. Keep changes to what was asked: no version bump, release or unrelated refactor. Never write the text @claude in a comment."
