# Claude answers `@claude` in pull request and issue comments from people with write access (the
# repository's owner, members and collaborators; anyone else's comment, issue or review is ignored):
# `@claude fix the review comments` on a PR pushes the fixes to that PR's branch, and
# `@claude review` reviews the PR again after new pushes. Comments from bots (including Claude's
# own review) never trigger it, and nothing on the daily-review or weekly-review issues does.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) and the Claude GitHub App.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

# One run per PR or issue at a time; a later request waits instead of cancelling one that's pushing.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Never on the daily and weekly review issues (the maintainer, 2026-11-07): they quote the usage
    # log, which anyone with the extension's upload token can write. The triggers are one group, and
    # then each review issue's label is refused, whatever the comment says or who wrote it. A PR's
    # conversation comment arrives as issue_comment too, with the PR as `issue`: the labels are
    # refused only where `issue.pull_request` is absent, so a PR is never held by them.
    if: |
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && github.event.review.user.type != 'Bot' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))) &&
      (github.event.issue.pull_request || (!contains(github.event.issue.labels.*.name, 'daily-review') && !contains(github.event.issue.labels.*.name, 'weekly-review')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write   # the action exchanges it for the Claude GitHub App's token
      actions: read     # lets Claude read CI results on the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # A comment in a PR's conversation arrives as issue_comment on the default branch, so
          # check out the PR's head instead: npm ci below must install that PR's lockfile.
          ref: ${{ github.event.pull_request.head.sha || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || '' }}
          # The PR's code must not find this job's token in .git/config (claude-code-action sets up its
          # own push access from the Claude GitHub App).
          persist-credentials: false
      # So Claude can run `npm test` before it pushes, as AGENTS.md requires.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Without the lockfile packages' install scripts: a fork PR's package.json must not run code
      # here. (Only fsevents, macOS-only, has one.)
      - run: npm ci --ignore-scripts
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(npm test),Bash(node --test:*),Bash(npm run package),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
            --append-system-prompt "Follow AGENTS.md (CLAUDE.md imports it). Read a PR description with gh pr view N --json title,body (plain gh pr view fails on project fields this token cannot read). When fixing review comments, read every review comment on the PR (gh api --paginate repos/OWNER/REPO/pulls/N/comments; without --paginate only the first 30 come back), skip the threads that are resolved (gh api graphql: pullRequest.reviewThreads with isResolved, paginated the same way), fix each one you agree with, and say which ones you did not change and why. Run npm test before pushing and report the result. Keep changes to what was asked: no version bump, release or unrelated refactor. Never write the text @claude in a comment."
