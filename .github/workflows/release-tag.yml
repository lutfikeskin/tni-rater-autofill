# Tags each extension version and gives it a GitHub Release (audit 2026-11-07, ORG-13): when a push
# to main brings the commit that set manifest.json's version, that commit is tagged v<version>, with
# the pull requests merged since the version before it as notes (scripts/release-notes.mjs).
# Only a version the push brought is tagged: one already on main before it never is (the
# maintainer, 2026-11-07: no backfill), so the first run tags nothing until the next version bump.
# A tag that exists already is left as it is when it names the same commit, and fails the run
# when it names another. Then the tagged commit is packaged (npm run package, in a job that can only
# read) and its store zip attached to the release by a job that runs nothing of the project, with
# its source maps' zip when the package makes one (audit 2026-11-07, QA-17): the zip a version's
# release holds is the one to upload. It uploads nothing to the Chrome Web Store
# (docs/chrome-web-store.md).
name: Release tag

on:
  push:
    branches: [main]
    paths: [manifest.json]

# No concurrency group: GitHub keeps one pending run per group and cancels the one before, which
# would drop a version bump's run when another manifest change follows it (the review of #429).
# Two runs never tag the same version: only the push that brought a version's commit tags it.

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # the tag and the release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the history back to the previous version
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/release-notes.mjs --ref origin/main --before "$BEFORE" --out notes.md >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          TARGET: ${{ steps.release.outputs.target }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          existing=$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)
          if [ -n "$existing" ] && [ "$existing" != "$TARGET" ]; then
            echo "::error::$TAG already names $existing, not $TARGET: check it by hand."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG already has a release: left as it is."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "$VERSION" --notes-file notes.md
          fi

  # The tagged commit, packaged as `npm run package` packages it, with only read access: the
  # packaging runs the project's dependencies, so it never holds the token that can write the
  # release (the review of #469). The zips go to the next job as an artifact.
  package:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.target }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          if [ "$(jq -r .version manifest.json)" != "$VERSION" ]; then
            echo "::error::the checked-out manifest isn't version $VERSION."
            exit 1
          fi
          # The store zip must be there; its source maps' zip only when the package makes one.
          if [ ! -f "dist/tni-rater-autofill-$VERSION.zip" ]; then
            echo "::error::npm run package made no dist/tni-rater-autofill-$VERSION.zip."
            exit 1
          fi
          mkdir release-zips
          cp "dist/tni-rater-autofill-$VERSION.zip" release-zips/
          if [ -f "dist/tni-rater-autofill-$VERSION-sourcemaps.zip" ]; then cp "dist/tni-rater-autofill-$VERSION-sourcemaps.zip" release-zips/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release-zips/
          if-no-files-found: error
          retention-days: 1

  # The zips attached to the release, with no checkout and nothing of the project run. An asset the
  # release has already is left as it is (a run again doesn't replace a zip that may have been
  # uploaded to the store).
  attach:
    needs: [tag, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # the release's assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release-zips
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          if [ ! -f "release-zips/tni-rater-autofill-$VERSION.zip" ]; then
            echo "::error::the package job handed over no tni-rater-autofill-$VERSION.zip."
            exit 1
          fi
          have=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for zip in "release-zips/tni-rater-autofill-$VERSION.zip" "release-zips/tni-rater-autofill-$VERSION-sourcemaps.zip"; do
            [ -f "$zip" ] || continue
            if printf '%s\n' "$have" | grep -qxF "$(basename "$zip")"; then
              echo "$TAG already has $(basename "$zip"): left as it is."
            else
              gh release upload "$TAG" "$zip" --repo "$GITHUB_REPOSITORY"
            fi
          done
