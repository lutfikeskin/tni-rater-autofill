name: Windows browser smoke

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run package
      - name: Extract the store ZIP with Windows
        shell: pwsh
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $destination = Join-Path $env:RUNNER_TEMP 'rater-store-package'
          Expand-Archive -LiteralPath "dist/tni-rater-autofill-$version.zip" -DestinationPath $destination
          $manifest = Get-Content (Join-Path $destination 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.key) { throw 'The store ZIP must not contain the development key' }
          if ($manifest.version -ne $version) { throw 'Store version does not match source' }
          if (!(Test-Path (Join-Path $destination $manifest.side_panel.default_path))) { throw 'Missing side panel' }
      - name: Packaged extension with the Node replay server
        shell: pwsh
        run: |
          $server = Start-Process -FilePath node -ArgumentList 'scripts/replay.mjs' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($server.HasExited) { throw 'Replay server exited before becoming ready' }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:8792/test/fixtures/amwins/application.html' -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 200 }
            }
            if (!$ready) { throw 'Replay server did not become ready' }
            npm run e2e:extension
            if ($LASTEXITCODE -ne 0) { throw 'Packaged extension check failed' }
          } finally {
            if (!$server.HasExited) { Stop-Process -Id $server.Id }
          }
      - run: npm run mock:amwins
      - run: npm run mock:amwins -- --reversed
      - run: npm run e2e -- --fixtures
      - run: npm run mock:claude
